# Keeps the commit-pinned actions in .github/workflows current: a monthly PR per update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Keeps the exact pins in pyproject.toml and uv.lock current: one grouped PR per week.
  # Weekly because this is also how security fixes arrive. Dependabot's own security PRs are off:
  # they edit pyproject.toml without uv.lock, so the locked self-check rejects them.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - "*"

  # Keeps the Dockerfile base image current. Python stays on 3.12, so only patch bumps.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
