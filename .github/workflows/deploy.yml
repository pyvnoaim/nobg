# Push to main -> run the self-check -> build the image on GitHub -> push it to GHCR -> tell Dokploy to redeploy.
# The VPS never builds: it only pulls ghcr.io/pyvnoaim/nobg:latest (pull_policy: always in Dokploy).
# Every build is also tagged with its short sha, so a rollback is changing the tag in Dokploy.
# Pull requests (Dependabot's included) run the self-check only.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Per ref, so a pull request run never cancels a deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Self-check
        run: uv run --locked test_remove_bg.py

  # Needs the check, so a failing check means nothing is built or deployed.
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false

      # DOKPLOY_WEBHOOK is the service's webhook URL (Dokploy > nobg > Deployments). It carries a token, hence the secret.
      - name: Redeploy on Dokploy
        env:
          URL: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: curl -fsS -X POST "$URL"
