# Local run with Docker: docker compose -f docker-compose.local.yml up --build
# (docker-compose.yml is the production file Dokploy runs.)
services:
  remove-bg:
    build: .
    image: remove-bg:latest
    container_name: remove-bg
    restart: unless-stopped
    # The app runs as uid 1000 and only listens on 7860, so it needs no capabilities.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "7860:7860"
    volumes:
      - models:/models    # 180MB model cache, downloads once, survives restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:7860/')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  models:
