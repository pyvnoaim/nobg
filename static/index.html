<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>nobg</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body data-phase="empty" data-mode="ai" data-bg="checker">

<header>
  <h1>nobg</h1>
  <div class="seg" role="group" aria-label="How to remove the background">
    <span class="seg-thumb"></span>
    <button type="button" id="mode-ai" aria-pressed="true">AI</button>
    <button type="button" id="mode-color" aria-pressed="false">Solid color</button>
  </div>
</header>

<main>
  <section class="invite">
    <p class="title" id="invite-title">Drop an image</p>
    <button type="button" class="link" id="choose">or choose a file</button>
    <p class="hint">Pasting works too. Up to 40 megapixels.</p>
  </section>

  <section class="error" role="alert">
    <p class="title" id="error-title"></p>
    <p class="hint" id="error-hint"></p>
    <button type="button" class="primary" id="retry">Choose another image</button>
  </section>

  <section class="stage">
    <div class="card" id="card">
      <div class="clip">
        <div class="backdrop"></div>
        <img id="after" alt="Cutout" draggable="false">
        <div class="before"><img id="before" alt="Original" draggable="false"></div>
        <div class="veil"></div>
        <div class="line"></div>
      </div>
      <div class="knob">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 6L3.5 10l4 4M12.5 6l4 4-4 4"/></svg>
      </div>
      <div class="hit" id="hit"></div>
      <input type="range" id="wipe" min="0" max="100" step="2" value="100" aria-label="Compare the cutout with the original">
    </div>

    <div class="progress">
      <div class="track"><div class="fill"></div></div>
      <p id="stage" aria-live="polite"></p>
    </div>

    <div class="controls">
      <div class="bar">
        <button type="button" class="quiet" id="new">New image</button>
        <div class="swatches" role="group" aria-label="Background">
          <button type="button" data-bg="checker" aria-pressed="true" aria-label="Transparent background"><span class="dot checker"></span></button>
          <button type="button" data-bg="white" aria-pressed="false" aria-label="White background"><span class="dot white"></span></button>
          <button type="button" data-bg="black" aria-pressed="false" aria-label="Black background"><span class="dot black"></span></button>
        </div>
        <button type="button" class="quiet" id="adjust" aria-expanded="false" aria-controls="panel">Adjust</button>
        <button type="button" class="quiet" id="copy">Copy</button>
        <button type="button" class="primary" id="download">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5"/></svg>
          <span id="download-label">Download</span>
        </button>
      </div>

      <div class="panel" id="panel" hidden>
        <label>
          <span class="row"><span>Tolerance</span><output id="tolerance-value">30</output></span>
          <input type="range" id="tolerance" min="5" max="120" step="1" value="30">
        </label>
        <label>
          <span class="row"><span>Edge smoothing</span><output id="smooth-value">1</output></span>
          <input type="range" id="smooth" min="0" max="5" step="0.5" value="1">
        </label>
        <button type="button" class="switch" id="edges" role="switch" aria-checked="true">
          <span class="switch-track"><span class="switch-knob"></span></span>
          <span>Keep inside areas</span>
        </button>
      </div>

      <p id="note" aria-live="polite"></p>
    </div>
  </section>
</main>

<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif" hidden>
<div class="ring"></div>

</body>
</html>
